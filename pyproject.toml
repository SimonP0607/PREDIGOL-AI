[project]
name = "football-intelligence"
version = "0.1.0"
description = "Football Betting Intelligence Platform — private, local-first"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "httpx>=0.28",
  "structlog>=24.4",
  "apscheduler>=3.10",
  "tenacity>=9.0",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "polars>=1.17",
]

[project.optional-dependencies]
analytics = ["numpy>=2.1", "scipy>=1.14", "statsmodels>=0.14", "duckdb>=1.1", "pyarrow>=18"]
ml        = ["scikit-learn>=1.5", "lightgbm>=4.5"]
dev       = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=6.0", "ruff>=0.8", "mypy>=1.13", "pip-audit>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fbi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = ["integration: requires a live PostgreSQL"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E","F","W","I","N","UP","B","C4","DTZ","SIM","RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/fbi/core/clock.py" = ["DTZ005"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/fbi/domain", "src/fbi/odds", "src/fbi/core", "src/fbi/catalog", "src/fbi/ingestion", "src/fbi/providers"]
