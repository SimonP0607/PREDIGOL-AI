# Live operation once the plan is active: which tiers are captured live, and the
# cadence that drives the daily request model (docs/rebuild/API_PLAN_CAPACITY_MODEL.md).
live:
  tiers: [1, 2]
  season_days: 280            # days over which a season's fixtures are spread, for the average day
  peak_share_of_week: 0.35    # share of a week's fixtures on its busiest day (a Saturday)
  prematch_windows: 6         # T-72h, T-48h, T-24h, T-12h, T-6h, T-3h (all reachable on a paid plan)
  near_close: 1               # /odds/live near kick-off
  lineup_polls: 2             # /fixtures?ids= at ~T-40 and ~T-20 min, batched by kick-off slot
  post_match_details: 1       # /fixtures?ids= once per finished fixture, batched
  injuries_daily_per_league: 1
  standing_syncs_daily: 12    # fixtures by date (4) and results by date (8)
  standings_daily_per_league: 1

storage:
  # Measured on our raw store (gzip): a season's fixture list is 13-18 KB.
  fixtures_season_kb: 17
  # Not measured yet (no detail payload stored): documented shape, ~40 KB JSON
  # per fixture, gzip about 1:6. Replace with the measured size after the first
  # real /fixtures?ids= request.
  details_per_fixture_kb: 7
  standings_kb: 6
  injuries_kb: 25
  teams_kb: 6
  players_page_kb: 20
  coverage_kb: 450
  # PostgreSQL, rows and indexes per fixture once details are normalised
  # (~15 events, ~40 lineup rows, ~32 player rows, 2 team rows).
  db_per_fixture_kb: 30
