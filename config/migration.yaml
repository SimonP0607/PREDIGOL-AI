# Historical migration: what to backfill from API-Football once a paid plan is
# active, in what order, and what it costs. Read by `python -m scripts.migration
# plan`, which prices everything BEFORE a request is made.
#
# The tiers are a starting selection. The final one is decided by the
# provider's own coverage flags (raw.league_coverage, from ONE /leagues call):
# a season the provider does not cover for statistics is not queried for them,
# and a league with fewer seasons than the target is shown with what it has.

version: 1

seasons:
  current: 2026          # the season key API-Football calls current (2026 = 2026/27)
  target_depth: 8        # completed seasons to backfill when the provider has them: 2018..2025
  include_current: true  # the current season's played fixtures as well

# Share of each day's quota the backfill leaves untouched for live operation, on
# top of the live model's own estimate (the engine also computes a live reserve
# every run and never spends it).
budget:
  live_reserve_fraction: 0.10
  buffer_fraction: 0.35     # safety margin on every estimate (25-40% asked for)
  max_backfill_days: 14     # a plan must finish the chosen tiers within this many days to "fit"

# Request cost of each unit kind. `classification` is why we fetch it at all:
#   MODEL_REQUIRED   a model or feature needs it
#   PRODUCT_REQUIRED a page needs it
#   OPTIONAL         useful later; not fetched unless asked (--with optional)
#   NOT_NEEDED       exists, deliberately not fetched
#   NOT_AVAILABLE    cannot be backfilled from this provider
endpoints:
  league_coverage:
    path: /leagues
    classification: MODEL_REQUIRED
    why: per-season coverage flags decide every other unit; one call returns all leagues
    requests: 1
  fixtures_season:
    path: /fixtures?league&season
    classification: MODEL_REQUIRED
    why: fixtures, scores (HT, ET, penalties), venue, status - one request per competition-season
  fixture_details:
    path: /fixtures?ids= (<=20)
    classification: MODEL_REQUIRED
    why: events, lineups, team statistics and player statistics in one request per 20 fixtures
    batch: 20
    per_fixture_without_batching: 4   # /fixtures/events + /lineups + /statistics + /players
    requires_coverage: [events, lineups, statistics_fixtures, statistics_players]   # any of them
  standings_season:
    path: /standings
    classification: PRODUCT_REQUIRED
    why: final tables per season for the Analytics page; derivable from results, kept for lineage
    requires_coverage: [standings]
  injuries_season:
    path: /injuries?league&season
    classification: MODEL_REQUIRED
    why: absences for lineup-aware strength (the provider keeps injuries from April 2021 only)
    since_season: 2020
    requires_coverage: [injuries]
  teams_season:
    path: /teams?league&season
    classification: PRODUCT_REQUIRED
    why: team and venue identity per season (names, venues, founded)
  players_season:
    path: /players?league&season&page
    classification: OPTIONAL
    why: season player profiles and totals; 20 per page. Per-fixture player statistics already come with fixture_details
    pages_estimate: 36
    requires_coverage: [players]
  predictions:
    path: /predictions?fixture
    classification: NOT_NEEDED
    why: the provider's own forecasts; one request per fixture and not a baseline we trust over the market
  top_players:
    path: /players/topscorers|topassists|topyellowcards|topredcards
    classification: NOT_NEEDED
    why: derivable from per-fixture player statistics
  odds_history:
    path: /odds
    classification: NOT_AVAILABLE
    why: pre-match odds are kept 7 days and live odds not at all - history comes from Football-Data.co.uk

# Tiers. `fixtures` is the planning estimate per season (our database knows the
