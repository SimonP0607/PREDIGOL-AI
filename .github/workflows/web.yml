name: Web CI

# Gates of web/CLAUDE.md and deploy/release.sh step 2: lint, typecheck, unit tests, production build.

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  push:
    branches: [main, 'ci/**']
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  web:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: lint
        run: bun run lint
      - name: typecheck
        run: bun run typecheck
      - name: unit tests
        run: bun test src
      - name: production build
        run: bun run build
        env:
          NITRO_PRESET: node-server
          VITE_DATA_MODE: live
      - name: bundle budget (plan de cierre UX, 5.2)
        run: bun scripts/bundle-budget.ts

  image:
    # The server builds web/Dockerfile, which the job above never touches: on 10 Nov 2026 a Dockerfile whose build step had
    # become part of a comment passed every check here and failed only on the server (OPS-003, fixed by OPS-004). This job builds
    # the same image (no push, no deploy) and checks that the output the final stage copies exists.
    name: imagen Docker de la web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: build web/Dockerfile
        run: docker build --build-arg VITE_API_BASE_URL=https://predigol.example --build-arg VITE_APP_VERSION=ci -t predigol-web:ci web
      - name: the image carries the server and the service worker
        run: docker run --rm --entrypoint sh predigol-web:ci -c 'test -f .output/server/index.mjs && test -f .output/public/sw.js'
