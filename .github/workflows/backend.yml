name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fbi
          POSTGRES_PASSWORD: fbi_ci
          POSTGRES_DB: fbi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev]"

      - name: Run ruff check
        working-directory: backend
        run: ruff check .

      - name: Run ruff format check
        working-directory: backend
        run: ruff format --check .

      - name: Run mypy
        working-directory: backend
        run: mypy

      - name: Run pytest
        working-directory: backend
        env:
          FBI_DATABASE_URL: postgresql+psycopg://fbi:fbi_ci@localhost:5432/fbi
          FBI_ENV: test
          PYTHONUTF8: '1'
        run: pytest -q --tb=short

      - name: Check model code fingerprint
        working-directory: backend
        run: python -m scripts.model_code_guard check

      - name: Check family fingerprints
        working-directory: backend
        run: python -m scripts.family_guard check

      - name: Run leak audit
        working-directory: backend
        run: python -m scripts.audit_leaks

      - name: Check isolation (unit tests)
        working-directory: backend
        run: pytest -q -m "not integration" --no-network

      - name: Test migrations (up and down)
        working-directory: backend
        env:
          FBI_DATABASE_URL: postgresql+psycopg://fbi:fbi_ci@localhost:5432/fbi
          FBI_ENV: test
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
