name: Backend CI

# The gates of backend/CLAUDE.md `make check` + deploy/release.sh step 2, run on GitHub's machines:
#   ruff check . && mypy && mypy . && pytest -q -p no:randomly
# (`ruff format --check` is NOT a gate of this project: 600+ files are not in that style on purpose.)

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [main, 'ci/**']
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  lint-types:
    name: ruff + mypy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[analytics,ml,dev]"
          # BE-017: solo para que mypy encuentre `hypothesis` y `schemathesis` (pruebas de propiedades y de la API); no es una dependencia del proyecto.
          pip install -c constraints.txt 'hypothesis==6.170.15' 'schemathesis==4.33.1'
      - name: ruff check
        run: ruff check .
      - name: mypy (strict packages)
        run: mypy
      - name: mypy (whole tree)
        run: mypy .
      - name: Model-code guard (informative)
        run: python3 scripts/model_code_guard.py fingerprint dir=.

  tests:
    name: pytest (PostgreSQL 16)
    runs-on: ubuntu-latest
    # The suite takes 30-39 min on a free runner; with several runs at once it passed 45 and was cancelled at 97 %
    # (main cf1ed4e8 and PR #103, 8-nov-2026), which also stops the automatic deploy. 60 leaves room without hiding a hang.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fbi
          POSTGRES_HOST_AUTH_METHOD: trust # throw-away service container of the job, never reachable from outside
          POSTGRES_DB: fbi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fbi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FBI_DATABASE_URL: postgresql+psycopg://fbi@localhost:5432/fbi_test
      FBI_ENV: test
      PYTHONUTF8: '1'
      # what backend/.env.test gives a developer's machine; the API settings refuse to load without a key (no call is ever made)
      FBI_APIFOOTBALL_KEY: test-key-not-real
      FBI_APIFOOTBALL_PLAN: pro
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[analytics,ml,dev]"
      - name: PostgreSQL 16 client tools (pg_dump, pg_restore)
        # The runner image ships newer client tools than the PostgreSQL 16 service: a dump made by a newer pg_dump
        # (``SET transaction_timeout``) does not restore into 16. The backup tests must use the version production runs.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version
      - name: Migrations apply (up, down one, up)
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
      - name: PostgreSQL de prueba sin esperas de disco
        # El contenedor es desechable: sin fsync ni escritura sincrónica las escrituras de la batería (miles de migraciones y semillas) no esperan al disco.
        # Es un ajuste de la sesión de este contenedor; nunca toca los servidores del proyecto.
        run: |
          psql -h localhost -U fbi -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"
      - name: pytest (primero en serie los archivos que dependen del orden)
        # CI-014. Ocho archivos no pueden compartir una corrida paralela: tres cuentan filas que el resto de la bateria tambien escribe (cuota
        # del dia, eventos de producto, pagina de jugador) y cinco crean y borran ROLES, que son del cluster y no de la base de cada proceso.
        # Marca `serial` (tests/integration/conftest.py). Tardan unos minutos.
        run: |
          pip install --no-cache-dir -c constraints.txt 'pytest-xdist==3.8.0' 'hypothesis==6.170.15' 'schemathesis==4.33.1'
          pytest -q -p no:randomly -m serial
      - name: pytest (4 procesos, una base de datos por proceso)
        # pytest-xdist solo se instala aqui (no es una libreria de la imagen: constraints.txt y pyproject.toml no cambian).
        # `--dist loadfile`: todas las pruebas de un archivo van al mismo proceso, porque muchos archivos crean y borran su propia base «fbi_test_<algo>».
        # Cada proceso migra una plantilla `fbi_test_gwN_tpl` una vez y cada archivo de pruebas trabaja en un clon propio (ver tests/integration/conftest.py).
        run: |
          pytest -q -p no:randomly -n 4 --dist loadfile -m "not serial" --durations=15