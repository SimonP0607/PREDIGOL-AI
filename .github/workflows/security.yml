name: Security

on:
  pull_request:
  push:
    branches: [main, 'ci/**']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # The same scanner and the same rules as .github/workflows/gitleaks.yml and the pre-commit hook (security/, plan de seguridad R07): the
      # version and its checksum are pinned in security/GITLEAKS_VERSION. A different version reads the rules in .gitleaks.toml differently.
      - name: gitleaks (pinned version)
        run: |
          set -euo pipefail
          . security/GITLEAKS_VERSION
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "${linux_x64_sha256}  gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gl"
          tar -xzf gitleaks.tgz -C "$RUNNER_TEMP/gl" gitleaks
          rm -f gitleaks.tgz
          GITLEAKS_BIN="$RUNNER_TEMP/gl/gitleaks" security/scan.sh history

  audit-backend:
    name: pip-audit (informative)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - working-directory: backend
        run: |
          pip install -c constraints.txt -e ".[analytics,ml,dev]"
          pip-audit --skip-editable

  audit-web:
    name: bun audit (informative)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - working-directory: web
        run: |
          bun install --frozen-lockfile
          bun audit