name: Debug subset (temporary)
on:
  push:
    branches: ['ci/**']
    paths: ['.github/workflows/debug-subset.yml']
permissions:
  contents: read
defaults:
  run:
    working-directory: backend
jobs:
  subset:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fbi
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fbi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fbi" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FBI_DATABASE_URL: postgresql+psycopg://fbi@localhost:5432/fbi_test
      FBI_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt
      - run: pip install -c constraints.txt -e ".[analytics,ml,dev]"
      - name: pick pipeline, with the logs
        run: pytest tests/integration/test_pick_pipeline.py -q -s -p no:randomly --tb=short -k whole_line_pick_keeps 2>&1 | tail -70
      - name: what Postgres and locale
        run: |
          psql -h localhost -U fbi -d postgres -c "select version(), current_setting('lc_collate'), current_setting('TimeZone')"
