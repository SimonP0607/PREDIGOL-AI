name: Debug subset (temporary)
on:
  push:
    branches: ['ci/**']
    paths: ['.github/workflows/debug-subset.yml']
permissions:
  contents: read
defaults:
  run:
    working-directory: backend
jobs:
  subset:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fbi
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fbi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fbi" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FBI_DATABASE_URL: postgresql+psycopg://fbi@localhost:5432/fbi_test
      FBI_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt
      - run: pip install -c constraints.txt -e ".[analytics,ml,dev]"
      - name: whole file
        run: pytest tests/integration/test_pick_pipeline.py -q -p no:randomly --tb=short
        continue-on-error: true
      - name: only the failing one
        run: pytest tests/integration/test_pick_pipeline.py -q -p no:randomly --tb=short -k whole_line_pick_keeps
        continue-on-error: true
      - name: only the failing one, 1 thread
        run: pytest tests/integration/test_pick_pipeline.py -q -p no:randomly --tb=short -k whole_line_pick_keeps
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'