name: Migrations lint

# CI-015. En un pull request que AÑADE una migración de Alembic: la pasa a SQL sin base de datos (`alembic upgrade <desde>:<hasta> --sql`) y la revisa
# con squawk (bloqueos largos, columnas NOT NULL sin valor, índices sin CONCURRENTLY, restricciones sin NOT VALID...). Solo lee las migraciones
# nuevas: las que ya están en producción se escribieron con sus propias reglas. Es INFORMATIVO (continue-on-error, como pip-audit): marca el PR en
# rojo para que se lea, pero no lo bloquea; pasará a obligatorio cuando haya varios PR sin falsos avisos. Las reglas que no encajan están en backend/.squawk.toml.

on:
  pull_request:
    paths:
      - 'backend/migrations/versions/**'
      - 'backend/.squawk.toml'
      - 'backend/scripts/lint_new_migrations.sh'
      - '.github/workflows/migrations-lint.yml'
  workflow_dispatch:

concurrency:
  group: migrations-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  squawk:
    name: squawk (informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/constraints.txt
      - name: Alembic (solo lo necesario para pasar migraciones a SQL)
        working-directory: backend
        run: pip install -c constraints.txt alembic sqlalchemy psycopg-binary python-dotenv
      - name: squawk (versión fijada y verificada)
        env:
          SQUAWK_VERSION: '2.72.0'
          SQUAWK_SHA256: 'a61661808119a82515565503111099b070c869f73698f61cb1785de5d0c8b11a'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sq"
          curl -sSfL -o "$RUNNER_TEMP/sq/squawk" "https://github.com/sbdchd/squawk/releases/download/v${SQUAWK_VERSION}/squawk-linux-x64"
          echo "${SQUAWK_SHA256}  $RUNNER_TEMP/sq/squawk" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/sq/squawk"
          echo "$RUNNER_TEMP/sq" >> "$GITHUB_PATH"
      - name: Migraciones nuevas del PR
        working-directory: backend
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/lint_new_migrations.sh "$BASE_SHA" "$HEAD_SHA"
