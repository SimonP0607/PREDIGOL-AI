name: Workflows lint

# CI-013. Revisa los propios workflows: actionlint (sintaxis, expresiones, shellcheck de los `run:`) y zizmor (seguridad: acciones sin fijar,
# credenciales que se quedan en el checkout, disparadores peligrosos, inyección en scripts). Solo corre si cambia `.github/`.
# Las dos herramientas van fijadas a versión (actionlint además con su suma de control): una versión nueva se sube a propósito, no sola.

on:
  pull_request:
    paths: ['.github/**']
  push:
    branches: [main]
    paths: ['.github/**']
  workflow_dispatch:

concurrency:
  group: workflows-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: actionlint (versión fijada y verificada)
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
          # shellcheck solo en aviso o error: sus notas «info» (SC2029 en los ssh donde expandir en el cliente es lo buscado, SC2012) no frenan el CI
          SHELLCHECK_OPTS: '--severity=warning'
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/actionlint.tgz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/al"
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP/al" actionlint
          "$RUNNER_TEMP/al/actionlint" -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: zizmor (versión fijada)
        run: |
          set -euo pipefail
          pip install --no-cache-dir 'zizmor==1.32.0'
          zizmor --no-progress --format github .github
