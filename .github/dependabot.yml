version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "python", "area:BE", "tipo:chore"]
    groups:
      # CI-016: las subidas menores y de parche llegan en UN solo PR a la semana (una sola pasada de pytest, de ~45 min); las mayores,
      # una por una, porque pueden romper algo y hay que verlas por separado.
      python-menores:
        update-types: ["minor", "patch"]
  - package-ecosystem: bun
    directory: /web
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "javascript", "area:FE", "tipo:chore"]
    groups:
      web-menores:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "github_actions", "area:CI", "tipo:chore"]
    groups:
      acciones-menores:
        update-types: ["minor", "patch"]
