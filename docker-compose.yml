name: football-intelligence

# Two ways to run the stack. Use ONE of them.
#
#   host mode     scripts/dev-up        API, worker and web as processes in WSL;
#                                       only postgres runs here.
#   compose mode  make up               postgres + api + worker in containers,
#                 (docker compose --profile stack up -d --build)
#                                       web on the host (bun run dev).
#
# Both use the same database (volume pgdata) and the same raw payload store
# (./data/raw), so switching modes loses nothing. Running both at once is
# refused by the worker itself: it holds a database advisory lock, and a
# second worker exits (code 75) naming the one that holds it.
#
# `docker compose up -d` with no profile starts postgres only, which is what
# host mode needs. api and worker only start when the stack profile is asked for.

x-backend: &backend
  build:
    context: .
    args:
      FBI_CODE_VERSION: ${FBI_CODE_VERSION:-unknown}
      FBI_UID: ${FBI_UID:-1000}
  image: fbi-backend:local
  env_file:
    - path: .env
      required: false
  depends_on:
    postgres: { condition: service_healthy }
  restart: unless-stopped
  profiles: ["stack"]

services:
  postgres:
    image: postgres:16-alpine
    container_name: fbi-postgres
    # Docker's default /dev/shm is 64 MB; PostgreSQL's parallel plans keep their shared hash tables there. From
    # 6 Oct 2026 19:44 UTC the quality sweep outgrew it (DiskFull). Same size as deploy/primary. Takes effect when
    # the container is next recreated (`docker compose up -d postgres`), not on a restart.
    shm_size: 512mb
    environment:
      POSTGRES_USER: fbi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fbi_local_dev}
      POSTGRES_DB: fbi
    ports: ["5433:5432"]
    volumes:
      # Named volume, not a bind mount: PostgreSQL on a 9P/UNC-backed directory
      # is slow and fsync-unsafe. `docker compose down -v` is the reset.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fbi -d fbi"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    <<: *backend
    container_name: fbi-api
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--log-level", "warning"]
    environment:
      FBI_DATABASE_URL: postgresql+psycopg://fbi:${POSTGRES_PASSWORD:-fbi_local_dev}@postgres:5432/fbi
    ports: ["127.0.0.1:8010:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    <<: *backend
    container_name: fbi-worker
    # A stable hostname keeps one heartbeat row (worker_id = <hostname>:worker)
    # instead of a new one per container.
    hostname: fbi-worker
    command: ["python", "-m", "apps.worker.main"]
    environment:
      FBI_DATABASE_URL: postgresql+psycopg://fbi:${POSTGRES_PASSWORD:-fbi_local_dev}@postgres:5432/fbi
      FBI_WEB_BASE_URL: ${FBI_WEB_BASE_URL:-http://localhost:5173}
    volumes:
      # The raw store is shared with host mode: a bind mount of the repo's own
      # data/raw (on the Linux filesystem, not /mnt/c). Paths in
      # raw.ingestion_payloads are relative to it, so lineage survives a switch.
      - ./data/raw:/app/data/raw
    stop_grace_period: 30s

  adminer:
    image: adminer:latest
    container_name: fbi-adminer
    ports: ["127.0.0.1:8011:8080"]
    depends_on: [postgres]
    profiles: ["dev"]

volumes:
  pgdata:
