# Primary pg_hba.conf. Replace 10.0.0.3 with the API box's private address.
local   all          all                          trust
host    all          all          127.0.0.1/32    scram-sha-256
# Docker bridge (worker container)
host    all          all          172.16.0.0/12   scram-sha-256
# Streaming replica on the API box, private network only
host    replication  replicator   10.0.0.3/32     scram-sha-256
host    fbi          fbi_ro       10.0.0.3/32     scram-sha-256
