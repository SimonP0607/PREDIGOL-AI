# Inventario legible por máquina de API-Football v3.9.3.
# Extraído de la documentación oficial el 29 sep 2026. Solo campos observados: nada inventado.
#
# classification: CORE | MODEL_REQUIRED | PRODUCT_REQUIRED | LIVE_REQUIRED | OPTIONAL |
#                 RESEARCH_ONLY | NOT_NEEDED
# data_tier:      0 reference | 1 match metadata | 2 match events | 3 player | 4 market | 5 live
# cost:           CHEAP | MODERATE | EXPENSIVE | VERY_EXPENSIVE
# ingestion.required: si entra en el backfill por defecto
# implemented_v2: none | raw_only | full

version: "3.9.3"
base_url: https://v3.football.api-sports.io
auth: { header: x-apisports-key, note: "solo GET; otras cabeceras son rechazadas" }
extracted_at: 2026-09-29
account_plan: ultra

endpoints:

  status:
    path: /status
    method: GET
    parameters: { required: [], optional: [] }
    pagination: false
    classification: [CORE]
    data_tier: 0
    cost: CHEAP
    history: false
    quota_free: true
    update_frequency: n/a
    ingestion: { required: false }
    implemented_v2: full
    notes: "no consume cuota; devuelve plan, consumo y suscripción"

  timezone:
    path: /timezone
    method: GET
    parameters: { required: [], optional: [] }
    pagination: false
    classification: [NOT_NEEDED]
    data_tier: 0
    cost: CHEAP
    history: false
    update_frequency: never
    ingestion: { required: false }
    implemented_v2: none

  countries:
    path: /countries
    method: GET
    parameters: { required: [], optional: [name, code, search] }
    pagination: false
    classification: [NOT_NEEDED]
    data_tier: 0
    cost: CHEAP
    history: false
    update_frequency: "al añadir un país nuevo"
    ingestion: { required: false }
    implemented_v2: none

  leagues:
    path: /leagues
    method: GET
    parameters:
      required: []
      optional: [id, name, country, code, season, team, type, current, search, last]
    pagination: false
    classification: [CORE, MODEL_REQUIRED]
    data_tier: 0
    cost: CHEAP
    history: true
    update_frequency: "varias veces al día"
    recommended_calls: "1 por hora"
    ingestion: { required: true, unit: league_coverage, requests: 1 }
    implemented_v2: full
    returns_coverage: true
    notes: "una llamada sin filtros devuelve todas las ligas x temporadas con 12 flags de cobertura"

  leagues_seasons:
    path: /leagues/seasons
    method: GET
    parameters: { required: [], optional: [] }
    pagination: false
    classification: [NOT_NEEDED]
    data_tier: 0
    cost: CHEAP
    history: false
    ingestion: { required: false }
    implemented_v2: none

  teams:
    path: /teams
    method: GET
    parameters:
      required: []
      optional: [id, name, league, season, country, code, venue, search]
      at_least_one: true
    pagination: false
    classification: [PRODUCT_REQUIRED]
    data_tier: 1
    cost: MODERATE
    history: true
    update_frequency: "varias veces por semana"
    ingestion: { required: false, unit: teams_season, requests: 1, blocked_by: "no hay normalizador" }
    implemented_v2: raw_only
    notes: "hoy gasta 1 peticion por liga-temporada y escribe 0 filas"

  teams_statistics:
