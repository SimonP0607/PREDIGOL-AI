  fixtures:
    path: /fixtures
    method: GET
    parameters:
      required: []
      optional: [id, ids, live, date, league, season, team, last, next, from, to, round, status, venue, timezone]
      limits: { ids: 20, last: 99, next: 99 }
    pagination: false
    classification: [CORE, MODEL_REQUIRED, PRODUCT_REQUIRED, LIVE_REQUIRED]
    data_tier: 1
    cost: MODERATE
    history: true
    update_frequency: "cada 15 segundos"
    recommended_calls: "1 por minuto con partido en juego, si no 1 por día"
    ingestion:
      required: true
      units: [fixtures_season, fixture_details]
      requests_per_league_season: 1
      requests_per_20_fixtures_with_ids: 1
    implemented_v2: full
    returns_inline_with_ids: [events, lineups, statistics, players]
    notes: "verificado en esta cuenta: ids= devuelve los 4 bloques, 3.8 KB/partido gzip"

  fixtures_headtohead:
    path: /fixtures/headtohead
    method: GET
    parameters:
      required: [h2h]
      optional: [date, league, season, last, next, from, to, status, venue, timezone]
