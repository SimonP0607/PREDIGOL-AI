    data_tier: 1
    cost: EXPENSIVE
    history: true
    update_frequency: "2 veces al día"
    ingestion: { required: false }
    implemented_v2: none
    notes: "100% derivable de nuestros propios partidos"

  teams_seasons:
    path: /teams/seasons
    method: GET
    parameters: { required: [team], optional: [] }
    pagination: false
    classification: [NOT_NEEDED]
    data_tier: 1
    cost: CHEAP
    history: true
    ingestion: { required: false }
    implemented_v2: none

