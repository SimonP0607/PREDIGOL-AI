    path: /teams/countries
    method: GET
    parameters: { required: [], optional: [] }
    pagination: false
    classification: [NOT_NEEDED]
    data_tier: 0
    cost: CHEAP
    history: false
    ingestion: { required: false }
    implemented_v2: none

  venues:
    path: /venues
    method: GET
    parameters: { required: [], optional: [id, name, city, country, search], at_least_one: true }
    pagination: false
    classification: [OPTIONAL]
    data_tier: 1
    cost: MODERATE
    history: false
    ingestion: { required: false }
    implemented_v2: none
