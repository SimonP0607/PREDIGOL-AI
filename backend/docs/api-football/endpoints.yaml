  standings:
    path: /standings
    method: GET
    parameters: { required: [season], optional: [league, team] }
    pagination: false
    classification: [PRODUCT_REQUIRED]
    data_tier: 1
    cost: MODERATE
    history: true
    update_frequency: "cada hora"
    ingestion: { required: true, unit: standings_season, requests: 1 }
    implemented_v2: full
    notes: "array de arrays: un sub-array por grupo. Solo leemos el bloque all"

  fixtures_rounds:
    path: /fixtures/rounds
    method: GET
    parameters: { required: [league, season], optional: [current, dates, timezone] }
    pagination: false
    classification: [NOT_NEEDED]
    data_tier: 1
    cost: MODERATE
    history: true
    ingestion: { required: false }
    implemented_v2: none
