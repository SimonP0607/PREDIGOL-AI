    note: "art. 16: the points of every match of the three phases of both tournaments; its paragraph: a Gran Final or Repechaje does not count. The provider's «Tabla Anual»."
gaps:
  - {topic: promotion, reason: "Arts. 19-25 are not computed: the same champion twice goes up and the 1st and 2nd of the reclasificación play the Repechaje (art. 20); two champions both 1st-2nd go up (art. 21 A); one of them 1st-2nd goes up and the other plays the Repechaje against the best placed (21 B); neither, a Gran Final, whose loser plays the Repechaje (21 C, 22, 24). Gran Final and Repechaje: two legs, points, goal difference, penalties (arts. 23, 25); their provider labels are not known yet."}
  - {topic: seeding, reason: "Art. 10: the groups of the cuadrangulares (3rd to 8th) are drawn; art. 12 par. 1-2: who is at home in each leg of a final. Recorded as notes, not computed."}
notes:
  - "Art. 4: a phase decided on penalties gives no extra points and the shoot-out's goals are not goals."
  - "Art. 5: 16 clubs; art. 7 A b: Envigado and Unión Magdalena, relegated from the Liga 2025, play it."
