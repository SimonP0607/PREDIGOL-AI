# Torneo BetPlay DIMAYOR I and II 2026 (provider league 240 «Primera B», season 2026). DIMAYOR regulation of the Torneo 2026,
# edition «V0 - 21/01/26» (file created 16-04-2026; downloaded 20-nov-2026 21:06 UTC, SHA-256 abe959c6...d319, 55 pages).
# IA-149 (plan PM, PM-03-09, 20-nov-2026): CODED IN SHADOW. Read from the official PDF with OCR (Tesseract, Spanish, 200 dpi;
# arts. 4-25 on pages 8-17 of the file). rules_for answers «reglamento no codificado» (pending_review) to every reader until a
# person compares it with the PDF article by article (backend/docs/owner/IA_149_COTEJO_REGLAMENTOS_COPA_TORNEO_2026.md) and the
# owner signs it; then a PR turns it into `coded` and `ia_rules load` records it.
# The year is two tournaments of the same three phases (art. 6): Fase I of 15 rounds, two groups of four (cuadrangulares) and a
# two-legged final. The provider's labels: "Apertura - N" and "Clausura - N" for Fase I; "Apertura Quadrangular - N" in
# tournament I but "Clausura - Quadrangular - N" in tournament II (both seen in production on 20-nov-2026); "Apertura - Final".
# Promotion to the Liga 2027 (arts. 19-25: Gran Final and Repechaje) depends on who the champions are and where they stand in
# the reclasificación: it is a gap, never computed.
