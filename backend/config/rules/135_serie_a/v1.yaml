tournaments:
  - key: season
    name: Serie A
    phases:
      - key: league
        name: League
        format: league
        rounds: ["Regular Season - *"]
        teams: 20
        schedule: double_round_robin
        matches_per_team: 38
        ranking:
          tiebreakers:
            - {criterion: h2h_points, note: "classifica avulsa: points in the matches among all the tied clubs"}
            - h2h_goal_difference
            - goal_difference
            - goals_for
            - lots
          h2h: {mode: once}
          note: "Two clubs level on points for 1st: single-match play-off at the home of the better ranked by the classifica avulsa. Two clubs level for 17th and 18th: two-legged play-off. More than two: the classifica avulsa names the two that play it and orders all other places."
        zones:
          - {kind: champion, from: 1, to: 1}
          - {kind: title_playoff, from: 1, to: 2, conditional: true, note: "only when exactly two clubs are level on points for 1st"}
          - {kind: relegation_playoff, from: 17, to: 18, conditional: true, note: "only when the 17th and 18th are level on points"}
          - {kind: relegation, from: 18, to: 20, target: Serie B, note: "NOIF art. 49"}
gaps:
  - topic: continental
    reason: "UEFA places depend on the access list and the Coppa Italia; not coded."
  - topic: tiebreak
