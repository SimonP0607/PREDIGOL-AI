# Major League Soccer (provider league 253), season 2026. Official league pages (mlssoccer.com).
schema: competition-rules/1
league_id: 253
competition: Major League Soccer
country: USA
version: 1
seasons: [2026]
points: {win: 3, draw: 1, loss: 0}
sources:
  - publisher: Major League Soccer
    title: Tiebreakers for 2026 MLS regular season standings
    url: https://www.mlssoccer.com/news/tiebreakers-for-2026-mls-regular-season-standings
    checked_at: 2026-11-16
    applies_to: season 2026 (conference seeding, play-off qualification, Supporters' Shield)
  - publisher: Major League Soccer
    title: "Audi 2026 MLS Cup Playoffs: Format & how it works"
