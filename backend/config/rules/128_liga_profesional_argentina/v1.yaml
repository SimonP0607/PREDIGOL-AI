# Liga Profesional de Fútbol de AFA (provider league 128), season 2026. Reglamento Torneos LPF Primera División 2026.
schema: competition-rules/1
league_id: 128
competition: Liga Profesional Argentina
country: Argentina
version: 1
seasons: [2026]
points: {win: 3, draw: 1, loss: 0}
sources:
  - publisher: Liga Profesional de Fútbol de la AFA
    title: Reglamento Torneos Primera División 2026
    url: https://www.ligaprofesional.ar/wp-content/uploads/2026/01/Reglamento-Torneos-LPF-Primera-2026.pdf
    checked_at: 2026-11-16
    applies_to: Torneo Apertura and Torneo Clausura LPF 2026, Tabla General 2026
    articles: arts. 8-10, 14-16, 24-28
tournaments:
  - key: apertura
    name: Torneo Apertura LPF 2026
    phases:
      - key: zonas
        name: Fase de zonas
        format: groups
        rounds: ["Apertura - [0-9]*"]
        teams: 30
        groups: 2
        group_size: 15
        schedule: other
        matches_per_team: 16
        ranking: &zonas
          tiebreakers:
            - goal_difference
            - goals_for
            - {criterion: h2h_points, note: "only the matches of the tournament against the clubs level on the place"}
            - h2h_goal_difference
            - h2h_goals_for
            - {criterion: fair_play, note: "Tabla General de Fair Play 2026 (art. 25) at the end of the zone phase"}
            - lots
          h2h: {mode: reapply}
          note: "16 matchdays: one round within the zone (14 matches), the interzonal derby of the free team, and one interzonal matchday. The zone table counts all 16."
        zones:
          - {kind: next_phase, from: 1, to: 8, per_group: true, target: octavos de final}
      - key: eliminatorias
        name: Octavos, cuartos, semifinales y final
        format: knockout
        rounds: ["Apertura - Round of 16", "Apertura - Quarter-finals", "Apertura - Semi-finals", "Apertura - Final"]
        schedule: ties
        knockout:
          legs: 1
          level: [extra_time, penalties]
          seeding: "1A v 8B, 1B v 8A, 2A v 7B ... 4B v 5A, at the better placed club's ground; the final at a venue set by the LPF (art. 8.2-8.5)"
  - key: clausura
    name: Torneo Clausura LPF 2026
    phases:
      - key: zonas
        name: Fase de zonas
        format: groups
        rounds: ["Clausura - [0-9]*"]
        teams: 30
        groups: 2
        group_size: 15
        schedule: other
        matches_per_team: 16
        ranking: *zonas
        zones:
          - {kind: next_phase, from: 1, to: 8, per_group: true, target: octavos de final, note: "art. 14.1.2: a club in a relegation place or a relegation decider cannot play the final stages; the next in its zone takes its place"}
      - key: eliminatorias
        name: Octavos, cuartos, semifinales y final
        format: knockout
        rounds: ["Clausura - Round of 16", "Clausura - Quarter-finals", "Clausura - Semi-finals", "Clausura - Final", "Round of 16", "Quarter-finals", "Semi-finals", "Final"]
        schedule: ties
        knockout:
          legs: 1
          level: [extra_time, penalties]
          seeding: "as in the Apertura (art. 14.2-14.5)"
        note: "The provider labels the Clausura knock-out rounds without the 'Clausura - ' prefix (seen 16-nov-2026: 'Round of 16')."
tables:
  - key: tabla_general
    name: Tabla General de Posiciones 2026
    kind: annual
    counts: ["apertura.zonas", "clausura.zonas"]
    ranking:
      tiebreakers:
        - goal_difference
        - goals_for
        - fair_play
        - lots
      note: "art. 24.3; ties in places that decide relegation go to decider matches (art. 24.4, art. 111 of the AFA General Regulation)."
    zones:
      - {kind: champion, from: 1, to: 1, target: Campeón de Liga 2026}
      - {kind: continental, from: 1, to: 6, conditional: true, target: CONMEBOL Libertadores 2027 (Argentina 4-6), note: "art. 27: the Apertura, Clausura and Copa Argentina champions are Argentina 1-3; the best placed in this table take 4-6"}
      - {kind: continental, from: 1, to: 12, conditional: true, target: CONMEBOL Sudamericana 2027 (Argentina 1-6), note: "art. 28"}
gaps:
  - topic: relegation
    reason: "Relegations are governed by article 93 of the AFA Statute (art. 26.1), which was not read: how many clubs go down and how the average (promedios) is built are not coded. Only the rule that ties in relegation places go to decider matches (art. 26.2) is."
