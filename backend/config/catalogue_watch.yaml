# PM-03-08 (Plan Maestro PM, DOC-010): the competitions the owner asked for that the provider does not have, the ones it stopped
# listing and the cyclical ones with no edition open - and the watch that says when that changes. Guide: docs/owner/EXPANSION_P3.md,
# section 8. Read by fbi.catalog.watch: by `python -m scripts.catalogue_watch` (0 requests, the /leagues already on disk) and, with
# FBI_CATALOGUE_WATCH on (OFF by default), after each daily catalogue_refresh. Listing or changing anything here tracks nothing.
#
# The watch compares by IDENTIFIER, never by name: a competition the provider renames is not new. Two findings:
#   * nueva: a league id of a priority country (`known`, the country as the provider spells it) that was not listed on the baseline
#     date - where a missing competition below would show up, if the provider ever adds it;
#   * edicion: a season newer than `last_season` for a competition of `waiting` - a discontinued one coming back, or the next
#     edition of a cyclical one (then it is a candidate for a batch of config/expansion.yaml, like any other).
# A finding repeats every day until this file is updated by a PR (the id added to `known`, or `last_season` moved): that PR is the
# acknowledgement.
version: 1
baseline:
  at: "2026-11-20T14:27:03Z"
  source: >-
    raw.league_coverage in production (the provider's /leagues of the daily catalogue_refresh), read-only, 0 requests: 702 league
    ids in the 28 countries below; the same 702 as annex A of the plan (provider's catalogue of 19 Nov 2026, 1,253 leagues)
  task: PM-03-08 (DOC-010)

# Not in the provider's /leagues at all (19 and 20 Nov 2026). No id to follow: the watch reports any NEW id of the country instead.
missing:
