# Batches, each decided on a probe (scripts.probe_leagues) and tracked with scripts.expand_leagues. Each is migrated
# as its own tier after the selector's tiers 1-4 (fbi.migration.config merges them), so the migration planner prices
# and seeds it like any other tier. A batch is added only after the previous one was measured for a day.
batches:
  - batch: 1
    tier: 5
    decided: "2026-10-05"
    probe: data/expansion/20261005T165323Z-probe
    rule: >-
      club league; on the 20 latest finished matches: events present, both line-ups with eleven starters in at least
      80 %, goal events adding up to the score in at least 95 %, no unresolved result; at least 25 fixtures ahead or a
      season running into 2027; at least 7 bookmakers on average (capacity probe)
    leagues: [252, 250, 244, 99, 100, 180, 183, 255, 506]
    notes: >-
      250 (Apertura) is the first half of 252's season: tracked together so Paraguayan clubs' history has no
      half-year gaps. Serie C Girone A (138) passed the rule but waits for its other two groups (942, 943): a
      division is added whole, or club histories break when a club changes group.
  - batch: 2
    tier: 6
    decided: "2026-11-05"
    probe: none - owner's decision (BE-002); the dry run of scripts.expand_leagues shows what the provider lists
    rule: >-
      owner's decision: follow every confederation's World Cup qualifiers, not only four of six, and the AFC Asian
      Cup next to the Africa Cup of Nations, Euro, Copa America and Gold Cup that tier 4 already follows
    leagues: [29, 33, 7]
    notes: >-
      National-team competitions. The catalogue classifies the two qualifiers (League, World) as national-team
      football at once; the Asian Cup (Cup, World) is catalogued as continental until scripts.sync_teams
      --scopes-only reads its teams, exactly as the World Cup, Euro and Africa Cup of Nations were.

  # IA-077 (owner's decision no. 10: follow Uruguay, Venezuela, Copa Colombia and Primera B if the provider has the
  # data and it fits the budget). Measured on 17 Nov 2026, 03:26 UTC, with the code's own client inside the worker:
  # 8 requests (per league, /fixtures?league&season=2026 and /fixtures?ids= of its 20 latest finished matches),
  # nothing stored in RAW, judged with fbi.catalog.league_probe.judge_detail - the probe's own checks. Coverage
  # flags from raw.league_coverage as refreshed at 00:28 UTC: no league lists a 2027 season yet. Split in two
  # batches on the line-up bar of batch 1, so each can be tracked (or left) on its own. Neither is tracked by this
  # file: `python -m scripts.expand_leagues --batch 3|4 --apply`, after the deployment, is the owner's step.
  # `measured` keeps the shares of the 20 sampled matches (0-1) and the provider's coverage flags for 2026.
  - batch: 3
    tier: 7
    decided: "2026-11-17"
    probe: >-
      IA-077 read-only probe, 17 Nov 2026 03:26 UTC (8 requests for batches 3 and 4, not stored); guide
      docs/owner/IA_077_COBERTURA_CUATRO_LIGAS.md
    rule: >-
      owner's decision no. 10, with the data part of batch 1's rule: club league; on the 20 latest finished matches
      events present, both line-ups with eleven starters in at least 80 %, goal events adding up to the score in at
      least 95 %, no unresolved result. The calendar part (25 fixtures ahead or a season into 2027) fails today for
      both: their value starts with the 2027 season, which the provider has not listed yet
    leagues: [299, 240]
    measured:
      299: {season: 2026, fixtures: 231, finished: 227, ahead: 3, unresolved: 0, sampled: 20, events: 1.0,
            lineups: 1.0, team_stats: 0.0, player_stats: 0.0, goals_match_events: 1.0,
            flags: {events: true, lineups: true, statistics_fixtures: false, statistics_players: false,
