# batches 5-9 with the procedure of scripts.probe_leagues - calendar of the current season of raw.league_coverage and
# /fixtures?ids= of the 20 latest finished matches judged with fbi.catalog.league_probe.judge_detail - plus one /odds page
# when matches are due in 14 days; no /standings (the provider's flag is kept instead). Nothing stored in RAW, no run opened;
# requests counted under job league_probe, lane ampliacion. Orders: docs/owner/lab/PM_03_01/; guide:
# docs/owner/PM_03_01_SONDA_LOTES_5_9.md.
# Per league: shares of the `sampled` matches (0-1; null = nothing to sample) for events, both line-ups of eleven, team
# statistics (corners, yellow cards and total shots for both sides), the provider's xG and player lines (22 or more);
# `referee` is the share of ALL finished matches with a referee; `bookmakers` the median of houses with a price on the
# `odds_fixtures` matches of the /odds page (null = not asked: no match within 14 days). `expected` is the level each family
# of coverage-levels-v1 (fbi.coverage.levels, DM-04) would get on this sample: B is the best a probe can give (A needs 30
# finished matches) and it is provisional; MI = fewer than 10 matches. The odds families are not graded by a probe (they need
# the finished matches of the odds window): `MI (techo X)` gives the ceiling their houses allow. `summary` is the directory
# summary without odds (a star: graded on the match data alone).
