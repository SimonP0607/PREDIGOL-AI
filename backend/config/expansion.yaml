            bookmakers: null}
      240: {season: 2026, fixtures: 290, finished: 286, ahead: 0, unresolved: 0, sampled: 20, events: 1.0,
            lineups: 0.95, team_stats: 0.0, player_stats: 0.0, goals_match_events: 1.0,
            flags: {events: true, lineups: true, statistics_fixtures: false, statistics_players: false,
                    standings: true, injuries: false, odds: true},
            bookmakers: null}
    notes: >-
      Results, events and line-ups only: no team or player statistics, so they feed the result models (Elo,
      Poisson) and the market, never a player market (decision no. 7). bookmakers null = not measured (the odds
      flag is the provider's declaration). Venezuela has 3 fixtures left (21-22 Nov); Primera B's 2026 has none
      (4 postponed). Cost at the rates measured on 10-16 Nov 2026 (6.1 requests per league and 24.8 per fixture a
      day): about 55 a day in season (1.75 fixtures a day), 90 at most if live capture grew with fixtures; history
      (2018-2026) about 300 requests once.
  - batch: 4
    tier: 8
    decided: "2026-11-17"
    probe: >-
      IA-077 read-only probe, 17 Nov 2026 03:26 UTC (the same 8 requests as batch 3)
    rule: >-
      owner's decision no. 10 only: both are BELOW batch 1's line-up bar (0.70 and 0.65 of the 20 latest matches
